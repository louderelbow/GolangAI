# ============================================================
# DeepTalk 前端 Nginx 配置
#
# 它干三件事：
#   1. 托管 Vue 构建出来的静态文件
#   2. 把 /api/... 反向代理到后端容器，并补上 /v1（跟 vue.config.js 里 devServer 的 pathRewrite 一致）
#   3. 流式对话的 SSE 必须关掉缓冲，否则前端会一直等到回答全部生成完才显示
# ============================================================

upstream deeptalk_backend {
    # backend 是 docker-compose 里的服务名，Docker 内置 DNS 会解析成容器 IP
    server backend:9090;
    # 和后端保持长连接，避免每个请求都重新握手
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 请求体上限 ----
    # Nginx 默认只允许 1MB，而文档上传接口允许 10MB。
    # 不改成 10m 的话，上传稍大一点的文档会直接返回 413，且后端完全收不到请求。
    client_max_body_size 10m;

    # ---- 日志 ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ---- 静态资源 ----
    # Vue CLI 产出的文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 路由回退 ----
    # Vue Router 的前端路由（如 /chat、/login）刷新时，浏览器会拿这个路径来请求服务器，
    # 服务器上没有对应文件，统一回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API ----
    # 前端 api.js 里 baseURL = '/api'，开发环境由 vue.config.js 的 devServer 把
    # '/api' 重写成 '/api/v1'。生产环境换成了 Nginx，所以要在这里做同样的替换：
    # proxy_pass 末尾带 URI（/api/v1/）时，Nginx 会把匹配到的 location 前缀（/api/）
    # 替换成 /api/v1/ —— 千万不要漏掉末尾那个斜杠。
    location /api/ {
        proxy_pass http://deeptalk_backend/api/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 【最关键的一条】关闭响应缓冲 ----
        # 流式对话接口返回的是 SSE（text/event-stream），前端用 fetch + ReadableStream
        # 逐块读取。只要中间任何一层做了缓冲，字节就会被攒着不发，前端表现就是
        # "点发送后一直转圈，等模型把整段话写完才一次性蹦出来"。
        # 这里对 /api/ 整体关闭，图的是简单可靠：请求体都很小，关掉的性能损失可以忽略，
        # 换来的是一整类"流式没生效"的坑直接不存在。
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # 后端已经带了这个响应头，这里再显式声明一次，双保险
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # 上游连接用不着复用（上面 keepalive 已经处理了），置空避免发 Connection: close
        proxy_set_header Connection "";

        # ---- 超时 ----
        # 大模型生成一段回答十几秒很正常，Nginx 默认 60 秒会直接 504。
        # 这里把读超时放到 5 分钟，覆盖长回答 + 检索 + 记忆压缩的耗时。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 后端如果把请求体读一半就返回错误，Nginx 不要一直重试
        proxy_next_upstream off;
    }

    # ---- 显式拒绝内部端点 ----
    # 后端的 /metrics 和 /debug/pprof 是给运维和排查用的，不在 /api/ 下，
    # 本来就不会被上面的 location 代理出去。这里再显式挡一层，
    # 防止以后有人图省事把 location / 整个转到后端时，把指标和 profile 一起暴露到公网。
    location = /metrics {
        return 404;
    }

    location ^~ /debug/ {
        return 404;
    }
}
